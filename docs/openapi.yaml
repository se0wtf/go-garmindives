        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Password attempt rate limit exceeded; Retry-After gives a delay in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already configured, setup in progress, or SQL initialization changed concurrently.
          content:
