  /api/v1/dives/years:
    get:
      tags:
      - Dives
      operationId: listDiveYears
      summary: List years present in stored dives for the year filter
      description: >-
        Public after setup. Returns distinct numeric years from dive local_date,
        newest first, across the entire stored logbook. Missing dates or years
        outside 1 through 9999 are omitted. Uses the dive's local calendar date,
        without converting start_time to UTC. An empty logbook returns items as
        an empty array. This list has no pagination or query filters and is
        independent of active dive-list filters. It is a local SQL read, with
        no Garmin request, and reflects newly imported dives on the next read.
        Use a selected year with GET /api/v1/dives?year=2025; it can be combined
        with country, ratings and the other existing dive filters.
      responses:
        '200':
          description: Complete list of dive years, distinct and newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveYears'
              example:
                items: [2026, 2025, 2023]
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Initial setup is incomplete or the configured runtime is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
