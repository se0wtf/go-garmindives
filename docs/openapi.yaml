                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Initial setup incomplete or pending service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '206':
          $ref: '#/components/responses/PartialFile'
        '304':
          $ref: '#/components/responses/NotModified'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
      description: 'Administrator only, Cache-Control: private, no-store. Originals stay unchanged in the inbox. Byte ranges,
        HEAD and conditional requests are supported. Same format=auto/original/jpeg rules as normal photo assets; HEIC
        auto mode receives cached JPEG.'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-garmindives_session
      description: Issued by POST /api/v1/auth/login. Secure, HttpOnly, SameSite=Strict, host-only session cookie. Use
        login first in Swagger; browser cookies cannot be set by the Authorize dialog.
    adminSessionDevelopment:
      type: apiKey
      in: cookie
      name: garmindives_session
      description: Local HTTP development only when GARMIN_COOKIE_SECURE=false. Production uses adminSession over HTTPS.
  parameters:
    MediaImageFormat:
      name: format
      in: query
      description: Photo representation. Auto negotiates JXL using explicit Accept support, otherwise cached JPEG. Original forces retained bytes (not the deleted pre-conversion source); jpeg forces JPEG. Videos ignore valid choices.
      schema:
        type: string
        enum: [auto, original, jpeg]
        default: auto
    MediaImageAccept:
      name: Accept
      in: header
      description: In auto mode, explicit image/jxl with positive quality selects native JXL. Wildcards and image/jxl;q=0 select cached JPEG. Ignored for explicit format choices and videos.
      schema:
        type: string
      example: image/jxl,image/jpeg;q=0.9
    TripID:
      name: tripID
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    HomeID:
      name: homeID
      in: path
      required: true
      schema:
        type: string
    Year:
      name: year
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 9999
    CountryFilter:
      name: country
      in: query
      schema:
        type: string
      description: Country code or French/English name; matching ignores accents and case.
    TripFilter:
      name: trip_id
      in: query
      schema:
        type: string
    Ratings:
      name: ratings
      in: query
      style: form
      explode: false
      description: >-
        Exact stored dive or trip ratings to include (OR), for example ratings=4,5.
        Omit to include rated and unrated items. A supplied filter excludes
        unrated items and combines with every other filter using AND. Decimal
        scores use a dot (ratings=4.5); commas separate scores. Zero is valid.
        Trip scores are 0 through 5; selecting a score above 5 cannot match a trip.
        Dive scores can use other scales; compare the raw rating without
        normalizing rating_max: 8/10 matches 8, not 4. Trip filtering uses the
        trip's own score, without averaging member dives. Duplicates are ignored;
        repeated ratings query parameters are
        also accepted, with at most 100 supplied values in total. Empty values,
        negative scores, NaN, infinity, malformed numbers and oversized lists
        return 400 invalid_request. Results remain newest first; keep this
        filter unchanged while continuing with next_cursor.
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: number
          format: double
          minimum: 0
      example: [4, 5]
    ActivityID:
      name: id
      in: path
      required: true
      description: Garmin activity ID (dive.id / SQL dives.id), distinct from garmin_dive_id and dive_number.
      schema: { type: integer, format: int64, minimum: 1 }
      example: 123456789
    MediaID:
      name: mediaID
      in: path
      required: true
      description: Opaque attachment ID from MediaItem.id.
      schema: { type: string }
      example: 4f899e011d1c4c18b1034b9e5a335198
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque next_cursor from the previous page of the same endpoint; omit on the first request.
      schema: { type: string }
    Range:
      name: Range
      in: header
      description: HTTP byte range for partial downloads or video seeking.
      schema: { type: string }
      example: bytes=0-1023
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Previously received quoted ETag. A match returns 304 with no body.
      schema: { type: string }
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      description: Previously received Last-Modified HTTP date.
      schema: { type: string }
    IfRange:
      name: If-Range
      in: header
      description: ETag or HTTP date to make a byte-range request conditional.
      schema: { type: string }

  headers:
    ETag:
      description: Quoted content/version hash for cache validation.
      schema: { type: string }
    LastModified:
      description: File modification time as an HTTP date.
      schema: { type: string }
    AcceptRanges:
      description: Supported range unit.
      schema: { type: string, enum: [bytes] }
    ContentLength:
      description: Number of bytes in the response body (or corresponding GET response for HEAD).
      schema: { type: integer, format: int64, minimum: 0 }
    ContentRange:
      description: Returned byte range and total file size.
      schema: { type: string }
      example: bytes 0-1023/1048576
    ContentDisposition:
      description: Inline disposition with the retained filename or generated representation filename.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid ID, query, cursor, JSON, or multipart request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: invalid_request, message: Request parameters are invalid } }
    NotFound:
      description: Dive, attachment, file, or thumbnail unavailable. Failed thumbnails use error code thumbnail_unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: not_found, message: Dive or media not found } }
    Conflict:
      description: Filename already exists (conflict), or the original changed on disk (media_changed); rescan before serving changed originals.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UploadTooLarge:
      description: Upload exceeds the configured per-file size limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: upload_too_large, message: File exceeds the configured upload limit } }
    UnsupportedMedia:
      description: Unsupported filename or media extension.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: unsupported_media, message: Unsupported media filename or extension } }
    InternalError:
      description: Local database, filesystem, or server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: internal_error, message: Internal server error } }
    CompleteFile:
      description: Complete retained media or selected photo representation, with the corresponding Content-Type.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
        Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
      content:
        '*/*':
          schema: { type: string, format: binary }
    PartialFile:
      description: Requested byte range; a multi-range request uses multipart/byteranges.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Range: { $ref: '#/components/headers/ContentRange' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
      content:
        '*/*':
          schema: { type: string, format: binary }
    FileHeaders:
      description: File headers only; no response body.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
        Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
    PartialFileHeaders:
      description: Requested byte-range headers only; no response body.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Content-Range: { $ref: '#/components/headers/ContentRange' }
        Content-Length: { $ref: '#/components/headers/ContentLength' }
    NotModified:
      description: Cached file is current; no response body.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
    PreconditionFailed:
      description: A conditional request precondition failed. File-serving errors can have an empty or plain-text body.
    RangeNotSatisfiable:
      description: Invalid or unsatisfiable byte range. GET returns a plain-text error; HEAD has no body.
      headers:
        Content-Range: { $ref: '#/components/headers/ContentRange' }
      content:
        text/plain:
          schema: { type: string }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Machine-readable error code. }
            message: { type: string, description: Human-readable explanation. }
    JSONValue:
      description: Arbitrary retained JSON, including objects, arrays, scalars, or null. Garmin and FIT fields may evolve.
    DiveList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DiveSummary' }
        next_cursor: { type: string, description: Omitted on the last page. }
    DiveSummary:
      type: object
      required:
      - id
      - name
      - activity_type
      - dive_type
      - start_time
      - local_date
      - timezone
      - location
      - notes
      - description
      - rating
      - rating_max
      - comment
      - highlights
      - cover_media_id
      - cover_photo
      - translations
      - year
      - country
      - detected_country
      - country_override
      - country_source
      - trip_id
      - trip_assignment
      properties:
        id:
          type: integer
          format: int64
          description: Garmin activity ID.
        garmin_dive_id:
          type: integer
          format: int64
          description: Separate identifier from Garmin Dive when available.
        dive_number:
          type: integer
        name:
          type: string
        activity_type:
          type: string
        dive_type:
          type: string
        start_time:
          type: string
          description: Recorded start time, usually ISO 8601; empty if unavailable.
        local_date:
          type: string
          description: Local YYYY-MM-DD date; empty if unavailable.
        timezone:
          type: string
        location:
          type: string
        entry_latitude:
          type: number
          format: double
        entry_longitude:
          type: number
          format: double
        exit_latitude:
          type: number
          format: double
        exit_longitude:
          type: number
          format: double
        notes:
          type: string
          description: Original stored Garmin Dive note; preserved verbatim.
        description:
          type: string
          description: Original stored activity description; Personal API notes can be stored here.
        rating:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Score parsed from a line such as N:4/5. Null when missing or invalid; a recorded zero is preserved.
          example: 4
        rating_max:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: Explicit rating denominator. Null when the rating is missing/invalid or no denominator was provided.
            Ratings are not normalized.
          example: 5
        comment:
          type: string
          description: Multiline text in Commentaire sections. Newlines are normalized and outer whitespace trimmed;
            empty when absent.
          example: 'Enfin pu faire la passe !

            On parle de canyons mais ce sont plus des tranchés que des vrais canyons.'
        highlights:
          type: array
          description: Nonempty lines in HL sections, in original order. Optional list bullets are removed; empty when
            absent.
          items:
            type: string
          example:
          - Pleiiin de requins vers les 50m
          - Raies aigles
          - Requin dormeur
        duration_seconds:
          type: number
          format: double
        max_depth_meters:
          type: number
          format: double
        average_depth_meters:
          type: number
          format: double
        average_heart_rate:
          type: number
          format: double
          description: Beats per minute.
        max_heart_rate:
          type: number
          format: double
          description: Beats per minute.
        min_temperature_celsius:
          type: number
          format: double
        average_temperature_celsius:
          type: number
          format: double
        max_temperature_celsius:
          type: number
          format: double
        cover_media_id:
          type: string
          nullable: true
          description: Selected photo attachment ID; null when no cover is selected.
        cover_photo:
          $ref: '#/components/schemas/DiveCoverPhoto'
        translations:
          $ref: '#/components/schemas/Translations'
        year:
          type: integer
          nullable: true
          description: Year of the dive local date.
        country:
          $ref: '#/components/schemas/Country'
        detected_country:
          $ref: '#/components/schemas/Country'
        country_override:
          type: string
          nullable: true
          description: Manual country code; null uses the detected country.
        country_source:
          type: string
          enum:
          - auto
          - manual
          - unknown
        trip_id:
          type: string
          nullable: true
        trip_assignment:
          type: string
          enum:
          - auto
          - manual
          - excluded
    DiveCoverPhoto:
      type: object
      nullable: true
      description: Lightweight cover photo included in lists and dive summaries. Null when no cover is selected; use thumbnail_url when present or fall back to url.
      required: [id, filename, description, url, translations]
      properties:
        id: { type: string, description: Selected photo attachment ID. }
        filename: { type: string, description: Retained photo filename; converted names include the original name and .jxl. }
        description: { type: string, description: User-provided description of the photo; empty when unset. }
        url: { type: string, description: Relative URL of the retained photo with auto image negotiation. }
        thumbnail_url: { type: string, description: Relative versioned thumbnail URL with auto JXL/JPEG negotiation; omitted if processing failed. }
        translations: { $ref: '#/components/schemas/Translations' }
    DivePatch:
      type: object
      additionalProperties: false
      properties:
        cover_media_id:
          type: string
          nullable: true
          minLength: 1
          description: Existing photo attachment ID for this dive. Use null to clear the cover.
        country_code:
          type: string
          nullable: true
          description: Country code or French/English name; null restores automatic GPS lookup.
        trip_id:
          type: string
          nullable: true
          description: Manually assign to a trip, or null to exclude the dive from automatic trips.
        trip_mode:
          type: string
          enum:
          - auto
          description: Restore automatic trip assignment; cannot be combined with trip_id.
      minProperties: 1
    DiveDetail:
      type: object
      required: [dive, activity, activity_details, dive_details, record_metadata, alerts, media]
      properties:
        dive: { $ref: '#/components/schemas/DiveSummary' }
        activity: { $ref: '#/components/schemas/JSONValue' }
        activity_details: { $ref: '#/components/schemas/JSONValue' }
        dive_details: { $ref: '#/components/schemas/JSONValue' }
        record_metadata:
          type: array
          items: { $ref: '#/components/schemas/RecordMetadata' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/DiveAlert' }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
    RecordMetadata:
      type: object
      required: [position, key]
      properties:
        position: { type: integer }
        key: { type: string }
    DiveAlert:
      type: object
      required: [index, type, data]
      properties:
        index: { type: integer }
        timestamp_ms: { type: integer, format: int64, description: Unix milliseconds. }
        type: { type: string }
        data: { $ref: '#/components/schemas/JSONValue' }
    SampleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DiveSample' }
        next_cursor: { type: string }
    DiveSample:
      type: object
      required: [index, timestamp_ms, elapsed_ms]
      properties:
        index: { type: integer, minimum: 0 }
        timestamp_ms: { type: integer, format: int64, description: Unix milliseconds. }
        elapsed_ms: { type: integer, format: int64, description: Milliseconds since the profile start. }
        heart_rate: { type: number, format: double, description: Beats per minute. }
        temperature_celsius: { type: number, format: double }
        depth_meters: { type: number, format: double }
        next_stop_depth_meters: { type: number, format: double }
        next_stop_time_seconds: { type: number, format: double }
        time_to_surface_seconds: { type: number, format: double }
        ndl_time_seconds: { type: number, format: double }
        percent_cns_load: { type: number, format: double }
        percent_n2_load: { type: number, format: double }
        psac: { type: number, format: double, description: Pressure-based surface air consumption in bar/min. }
        rmv: { type: number, format: double, description: Respiratory minute volume in L/min. }
        vsac: { type: number, format: double, description: Volume-based surface air consumption in L/min. }
        air_time_remaining_seconds: { type: number, format: double }
        po2: { type: number, format: double, description: Oxygen partial pressure in bar. }
        ascent_rate: { type: number, format: double, description: Meters per second. }
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        next_cursor: { type: string }
    StereoLayout:
      type: string
      enum: [auto, mono, side_by_side, top_bottom, multiview]
      description: auto uses detected metadata; explicit layouts also control thumbnail eye selection.
    Projection:
      type: string
      enum: [auto, flat, '180', '360']
      description: Defaults to auto for new media. Uses spherical metadata when present; explicit 360 denotes a stitched equirectangular export when no format metadata is available.
    MediaItem:
      type: object
      required:
      - id
      - filename
      - kind
      - content_type
      - size_bytes
      - sha256
      - width
      - height
      - duration_seconds
      - stereo_layout
      - projection
      - effective_projection
      - caption
      - description
      - thumbnail_status
      - probe
      - created_at
      - updated_at
      - url
      - translations
      - favorite
      properties:
        id:
          type: string
          description: Opaque attachment identifier.
        dive_id:
          type: integer
          format: int64
          description: Garmin activity ID.
        filename:
          type: string
          description: Retained filename. Converted photos append .jxl; normalized videos from non-MP4/M4V containers append .mp4. Very long names are shortened with a hash. Compatible videos and small photos retain their names.
        kind:
          type: string
          enum:
          - photo
          - video
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        width:
          type: integer
          minimum: 0
          description: Original encoded width; zero if inspection failed.
        height:
          type: integer
          minimum: 0
          description: Original encoded height; zero if inspection failed.
        duration_seconds:
          type: number
          format: double
          minimum: 0
        stereo_layout:
          $ref: '#/components/schemas/StereoLayout'
        detected_stereo_layout:
          type: string
          description: Detected layout when available; omitted otherwise.
        projection:
          $ref: '#/components/schemas/Projection'
        effective_projection:
          type: string
          enum:
          - flat
          - '180'
          - '360'
          description: Resolved projection for the frontend player. Auto resolves to flat unless spherical metadata
            identifies 360-degree media.
        projection_format:
          type: string
          enum:
          - equirectangular
          - cubemap
          description: Detected source texture format; explicit 360 defaults to equirectangular when metadata is missing.
        caption:
          type: string
        description:
          type: string
          description: User-provided description of what the photo/video shows; empty when unset.
        thumbnail_status:
          type: string
          enum:
          - ready
          - error
        thumbnail_error:
          type: string
          description: Present when inspection/thumbnail generation failed, or an older HEIC conversion requires its original source for repair.
        probe:
          type: object
          additionalProperties: true
          description: Inspection metadata and optional garmindives_photo processing marker (version 1, source filename/hash, projection hints, optional heif_decoder_version=1); HEIF inspection describes the complete oriented image. Empty on inspection failure.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          description: Relative URL for the retained file; filename is URL-encoded. Photos negotiate JXL/JPEG unless format is explicit.
        thumbnail_url:
          type: string
          description: Relative versioned thumbnail URL (photo JXL with JPEG fallback, video JPEG); omitted unless thumbnail_status is ready.
        translations:
          $ref: '#/components/schemas/Translations'
        capture:
          $ref: '#/components/schemas/PhotoCapture'
        trip_id:
          type: string
          description: Owning trip ID; present for trip-owned media instead of dive_id.
        favorite:
          type: boolean
          description: Favorite dive attachment. Trip-owned media always has false.
      oneOf:
      - required:
        - dive_id
      - required:
        - trip_id
    Translations:
      type: object
      required: [en]
      description: French originals remain in the existing response fields. English is cached separately; request handlers never wait for the translation provider. Use French while en.status is not ready. Empty text is ready without a provider call.
      properties:
        en: { $ref: '#/components/schemas/EnglishTranslation' }
    EnglishTranslation:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - ready
          - error
          - disabled
          description: pending waits for background processing; ready exposes available English fields; error requires
            retry or provider recovery; disabled means no DEEPL_API_KEY and no cached result. Existing ready cache entries
            work without a key.
        comment:
          type: string
          description: Translated dive comment; present only when ready and nonempty.
        highlights:
          type: array
          items:
            type: string
          description: Translated dive highlights in the original order; present only when ready and nonempty.
        caption:
          type: string
          description: Translated media caption; present only when ready and nonempty.
        description:
          type: string
          description: Translated media/cover description; present only when ready and nonempty.
        error:
          type: string
          description: Machine-readable provider/cache error code; credentials and upstream response text are never
            included.
        name:
          type: string
          description: English trip name. Generated/manual names can be available even while other fields are pending.
        subtitle:
          type: string
          description: Translated trip subtitle.
        operator_comment:
          type: string
          description: Translated cruise operator comment.
        price:
          type: string
          description: Translated approximate per-person trip price text.
    TranslationStatus:
      type: object
      required: [enabled, provider, source_language, target_language, target_locale, pending, ready, failed, cached_revisions]
      properties:
        enabled: { type: boolean, description: Whether a translation provider is configured for this running server. }
        provider: { type: string, enum: [deepl] }
        source_language: { type: string, enum: [fr] }
        target_language: { type: string, enum: [en] }
        target_locale: { type: string, enum: [EN-GB, EN-US] }
        pending: { type: integer, format: int64, minimum: 0 }
        ready: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        cached_revisions: { type: integer, format: int64, minimum: 0 }
        blocked_reason: { type: string, description: Authentication/quota error pausing provider calls until restart or explicit retry. }
    MediaPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        caption:
          type: string
          description: At most 4096 UTF-8 bytes; an empty string clears it.
        description:
          type: string
          description: At most 8192 UTF-8 bytes describing the photo/video; an empty string clears it.
        stereo_layout:
          $ref: '#/components/schemas/StereoLayout'
        projection:
          $ref: '#/components/schemas/Projection'
        favorite:
          type: boolean
          description: Mark/unmark a dive photo or video as favorite. Not accepted for trip-owned media.
    MediaScanResult:
      type: object
      required: [scanned, added, updated, unchanged, removed, skipped, failed]
      properties:
        scanned: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0, description: Indexing or thumbnail failures; may overlap added/updated counts. }
    MediaStatus:
      type: object
      required: [total, photos, videos, thumbnails_ready, thumbnails_failed, max_upload_bytes, thumbnail_max_dimension, photo_thumbnail_small_side, photo_max_small_side, photo_keep_below_bytes, photo_keep_below_small_side]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        photos: { type: integer, format: int64, minimum: 0 }
        videos: { type: integer, format: int64, minimum: 0 }
        thumbnails_ready: { type: integer, format: int64, minimum: 0 }
        thumbnails_failed: { type: integer, format: int64, minimum: 0 }
        max_upload_bytes: { type: integer, format: int64, minimum: 1, example: 17179869184 }
        thumbnail_max_dimension: { type: integer, example: 640, description: Video thumbnail maximum dimension. }
        photo_thumbnail_small_side: { type: integer, example: 480 }
        photo_max_small_side: { type: integer, example: 1080 }
        photo_keep_below_bytes: { type: integer, format: int64, example: 1000000, description: Strict byte threshold; both keep thresholds must match. }
        photo_keep_below_small_side: { type: integer, example: 2048, description: Strict shorter-side threshold; both keep thresholds must match. }

    Country:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          example: EG
        name_fr:
          type: string
          example: Égypte
        name_en:
          type: string
          example: Egypt
      nullable: true
      description: Country/destination with local bilingual names. Overseas territories such as NC and PF are separate
        from FR. Null when unknown.
      required:
      - code
      - name_fr
      - name_en
    DiveYears:
      type: object
      properties:
        items:
          type: array
          uniqueItems: true
          description: Years present in dive local dates, descending; empty array when none exist.
          items:
            type: integer
            minimum: 1
            maximum: 9999
      required:
      - items
    CountryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
      - items
    MissingCountryLookup:
      type: object
      properties:
        status:
          type: string
          enum: [not_found, error, pending, missing_coordinates]
        latitude:
          type: number
          nullable: true
          description: Cached lookup position, in degrees; null when no lookup row exists.
        longitude:
          type: number
          nullable: true
          description: Cached lookup position, in degrees; null when no lookup row exists.
        error_code:
          type: string
          description: Sanitized failure code, omitted when empty. Can also describe a retrying pending job.
        attempts:
          type: integer
          minimum: 0
          description: Consecutive failed attempts for the shared lookup position, not the number of dives.
        checked_at_ms:
          type: integer
          format: int64
          nullable: true
          description: Unix milliseconds of the latest cached lookup result/failure; null before a result exists.
      required: [status, latitude, longitude, attempts, checked_at_ms]
    MissingCountryDive:
      type: object
      properties:
        dive:
          $ref: '#/components/schemas/DiveSummary'
        lookup:
          $ref: '#/components/schemas/MissingCountryLookup'
      required: [dive, lookup]
      description: Dive summary with name/date/entry and exit GPS; country is unknown and no manual country override exists.
    MissingCountryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MissingCountryDive'
        next_cursor:
          type: string
          description: Omitted on the last page. Keep lookup_status unchanged when continuing.
      required: [items]
    CountryLookupStatus:
      type: object
      properties:
        enabled:
          type: boolean
        pending:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        not_found:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        request_interval_seconds:
          type: number
        attribution:
          type: string
          description: Display this OpenStreetMap attribution when using geocoded countries.
        blocked_reason:
          type: string
          description: Provider configuration/authentication rejection pausing calls until retry or restart.
      required:
      - enabled
      - pending
      - ready
      - not_found
      - failed
      - request_interval_seconds
      - attribution
      description: Counts unique positions currently used for automatic detection; manual overrides and unreferenced
        cache entries are excluded.
    HomeCountry:
      type: object
      properties:
