        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        captured_at:
          type: string
          format: date-time
        timezone_assumed:
          type: boolean
        ambiguous_time:
          type: boolean
          description: Repeated local clock hour during a timezone transition; requires manual assignment.
    PendingItem:
      type: object
