      - scan_interval_seconds
      - match_window_seconds
      - settle_seconds
      - scan
      properties:
        total:
          type: integer
          format: int64
        reasons:
          type: object
          additionalProperties:
            type: integer
            format: int64
        directory:
          type: string
        scan_interval_seconds:
          type: number
          example: 60
        match_window_seconds:
          type: integer
          example: 600
        settle_seconds:
          type: integer
          example: 2
        scan:
          $ref: '#/components/schemas/PendingScanStatus'
