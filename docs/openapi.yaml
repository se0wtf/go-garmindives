          type: integer
          minimum: 0
        assigned:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    PendingScanStatus:
      type: object
      required:
      - running
      - result
      properties:
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/PendingScanResult'
        error:
          type: string
    PendingStatus:
      type: object
      required:
