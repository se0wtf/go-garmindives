    SetupStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: Persistent setup state; stays true during outages or after removing residence periods.
        ready:
          type: boolean
          description: Normal API/runtime is active.
        state:
          type: string
          description: not_configured, starting, ready, or an availability/configuration error.
        database_type:
          type: string
          enum:
          - sqlite
          - postgres
        database_uri_configured:
          type: boolean
        overrides:
          type: object
          additionalProperties:
            type: string
          description: Setting name to controlling ENV variable or command flag. Contains no setting values.
        password_min_length:
          type: integer
          example: 15
        password_max_length:
          type: integer
          example: 128
      required:
      - configured
      - ready
      - state
      - database_type
      - database_uri_configured
      - overrides
      - password_min_length
      - password_max_length
    DatabasePatch:
      type: object
      properties:
        type:
          type: string
          enum:
          - sqlite
          - postgres
        uri:
          type: string
          maxLength: 8192
          description: 'Persistent SQLite filename/file: URI, or PostgreSQL URI/DSN. ENV/flag overrides remain authoritative.
            Omit unchanged ENV-managed settings.'
      additionalProperties: false
      minProperties: 1
    SetupResidence:
      type: object
      properties:
        country_code:
          type: string
          description: Country code or French/English name.
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          nullable: true
          description: Inclusive end date; null/omitted is open-ended.
      additionalProperties: false
      required:
      - country_code
      - from
    SetupRequest:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DatabasePatch'
        admin_password:
          type: string
          format: password
          maxLength: 128
          description: 'New administrator password: 15–128 Unicode characters, passphrases allowed, common/repeated
            patterns rejected. For an already initialized database, provide its existing password to adopt it without
            resetting credentials.'
        home_countries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SetupResidence'
          description: At least one residence period must exist after first setup. Existing identical periods are reused;
            overlaps rejected. Existing initialized databases retain their residence history.
      additionalProperties: false
      required:
      - admin_password
    SetupResult:
      type: object
      properties:
        configured:
          type: boolean
          example: true
        ready:
          type: boolean
          example: false
        state:
          type: string
          example: starting
      required:
      - configured
      - ready
      - state
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          maxLength: 128
      additionalProperties: false
      required:
      - password
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
          description: Spaces and Unicode are supported; common/repeated patterns are rejected. Password changes revoke
            every administrator session.
      additionalProperties: false
      required:
      - current_password
      - new_password
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry; idle expiry can occur earlier. Omitted for anonymous sessions.
      required:
      - authenticated
    DatabaseDisplay:
      type: object
      properties:
        type:
          type: string
          enum:
          - sqlite
          - postgres
        uri_display:
          type: string
          description: Safe display destination only; credentials and PostgreSQL URI options are omitted. This is not
            a replacement connection URI.
        uri_configured:
          type: boolean
      required:
      - type
      - uri_display
      - uri_configured
    HTTPSettings:
      type: object
      properties:
        listen:
          type: string
        cookie_secure:
          type: boolean
        public_url:
          type: string
          description: Optional external origin for reverse-proxy CSRF validation.
      required:
      - listen
      - cookie_secure
    AuthSettings:
      type: object
      properties:
        session_lifetime:
          type: string
          example: 24h
          description: Go duration between 1m and 720h.
        idle_timeout:
          type: string
          example: 2h
          description: Go duration between 1m and session_lifetime.
      required:
      - session_lifetime
      - idle_timeout
    MediaSettings:
      type: object
      properties:
        directory:
          type: string
        max_upload_bytes:
          type: integer
          format: int64
        pending_directory:
          type: string
          description: Inbox path; relative paths resolve against media.directory. Default pending.
        pending_scan_interval:
          type: string
          description: Go duration from 1s through 24h; default 60s.
      required:
      - directory
      - max_upload_bytes
      - pending_directory
      - pending_scan_interval
    Configuration:
      type: object
      properties:
