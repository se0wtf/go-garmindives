  /api/v1/admin/dives/missing-country:
    get:
      tags:
      - Countries
      operationId: listDivesMissingCountry
      summary: Review dives with no country for manual correction (administrator only)
      description: >-
        Returns one row per dive with no effective country. A lookup shared by
        multiple dives produces multiple rows. Already detected or manually
        corrected dives are excluded. By default includes all unresolved dives;
        use lookup_status=not_found for completed lookups without a result.
        Results are ordered by local date, start time, and activity ID descending,
        with the same cursor format as the dive list. The lookup object includes
        the cached coordinates, sanitized error code, consecutive failure count,
        and last check timestamp when available. This is a local SQL read; it
        never retries or calls the geocoder. Choose from GET /api/v1/countries
        and PATCH /api/v1/dives/{id} with country_code to correct a dive. The dive
        then leaves this list and automatic trip reconciliation runs. A correction
        affects that dive only, including when other dives share its coordinates.
      security:
      - adminSession: []
      - adminSessionDevelopment: []
      parameters:
      - name: lookup_status
        in: query
        schema:
          type: string
          default: all
          enum: [all, not_found, error, pending, missing_coordinates]
        description: >-
          not_found means no provider result; error means failed work; pending
          includes queued/processing work, retries and results awaiting local
          reconciliation; missing_coordinates means no usable lookup position.
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Dives needing a country; items is an empty array when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingCountryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Administrator authentication is required or the session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Setup is incomplete, the runtime is unavailable, or administrator/session SQL cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
