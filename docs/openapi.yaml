openapi: 3.0.3
info:
  title: go-garmindives API
  version: 1.0.0
  description: 'Read synchronized Garmin dives and manage their photos and videos locally.

    Reads are public after initial setup. Every mutation and configuration endpoint requires an administrator session.
    Garmin credentials are only needed by the separate sync command.


    Dive IDs are Garmin activity IDs (SQL dives.id), distinct from Garmin Dive

    IDs and dive numbers. Optional measurements are omitted when unavailable;

    recorded zeroes are preserved. Depth is in meters, temperature in Celsius,

    durations in seconds, and sample timestamps/elapsed times in milliseconds.


    Compatible H.264/AAC MP4 videos within 1080p bounds and small photos retain their filenames and bytes. Other videos are normalized to H.264 MP4; larger photos become JPEG XL

    after verified processing; their source is deleted after a successful SQL update. Metadata and thumbnails

    are indexed at server startup or by POST /api/v1/media/scan. Uploads and scans

    process files synchronously and can take time for large/360-degree videos.


    Initial setup: GET /api/v1/setup/status, POST /api/v1/setup, then poll status until ready. Normal APIs return
    503 not_configured until setup completes. POST /api/v1/auth/login sets an HttpOnly session cookie; browsers
    send it automatically on same-origin requests. No JWT or external authentication service is required. Existing
    SQL dives and original FIT/media data are preserved.

    '
servers:
  - url: /
    description: The server hosting this specification
security: []
tags:
  - name: Health
    description: Local database health
  - name: Dives
    description: Dive summaries, source documents, graph samples, and private original FIT downloads
  - name: Media
    description: Photos, videos, descriptions, 360-degree projection metadata, captions, and filesystem indexing
  - name: Assets
    description: Retained media, JXL photo/JPEG video thumbnails, and cached JPEG fallbacks with range/conditional requests
  - name: Pending media
    description: Administrator-only photo/video inbox, capture-time matching and manual assignment
  - name: Translations
    description: Background French-to-English translation, cached in the local database

  - name: Countries
    description: Cached GPS country detection and bilingual country catalog
  - name: Home countries
    description: Dated residence history used for automatic trips
  - name: Trips
    description: Automatic/manual dive trips, cruise metadata, and independent trip
      media
  - name: Favorites
    description: Favorite media from individual dives, optionally filtered by trip

  - name: Setup
    description: First-run setup and status, available before SQL configuration
  - name: Authentication
    description: Local administrator login and SQL-backed cookie sessions
  - name: Configuration
    description: Authenticated settings; changes require restart

paths:
  /api/v1/health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Check database connectivity
      responses:
        '200':
          description: The local SQL database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dives:
    get:
      tags:
      - Dives
      operationId: listDives
      summary: List dives, newest first
      description: Ordered by local_date, start_time, and activity ID descending. Pass next_cursor unchanged for the
        following page.
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      - name: from
        in: query
        description: Inclusive local date, YYYY-MM-DD.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive local date, YYYY-MM-DD. Must not precede from.
        schema:
          type: string
          format: date
      - name: location
        in: query
        description: Case-insensitive substring of the dive location.
        schema:
          type: string
      - $ref: '#/components/parameters/Year'
      - $ref: '#/components/parameters/CountryFilter'
      - $ref: '#/components/parameters/TripFilter'
      - $ref: '#/components/parameters/Ratings'
      responses:
        '200':
          description: A page of dive summaries including cover_photo URLs. next_cursor is omitted on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/dives/{id}/fit:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    get:
      tags: [Dives]
      operationId: downloadOriginalFIT
      summary: Download cached original FIT files (administrator only)
      description: >-
        Requires an authenticated administrator session, including HEAD and range
        requests. Reads stored original bytes from SQL without contacting Garmin.
        One file returns a .fit attachment; multiple files return a ZIP attachment
        containing every original, with index-prefixed basenames to prevent paths
        and duplicate names. Every file's size and SHA-256 are verified first.
        Successful downloads use Cache-Control private, no-store and
        Content-Disposition attachment. Single files support byte ranges; ZIPs
        stream in full. HEAD returns headers only. FIT documents and Base64 file
        contents are never embedded in JSON responses, even for administrators
        or include=fit requests.
      security:
      - adminSession: []
      - adminSessionDevelopment: []
      responses:
        '200':
          description: Original .fit file, or a ZIP when multiple files are stored.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment with a safe filename.
            Cache-Control:
              schema: { type: string }
              description: private, no-store.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '206':
          description: Requested byte range of a single original FIT file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Administrator authentication required, or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not_found for an unknown dive; fit_unavailable when no original FIT is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Invalid byte range for a single original FIT file.
          content:
            text/plain:
              schema: { type: string }
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Setup incomplete, or runtime/session database unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dives/{id}:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    get:
      tags:
      - Dives
      operationId: getDive
      summary: Read a dive with Garmin source documents, indexed metadata, and media
      description: 'Raw Garmin documents can contain additional fields or be null. Personal

        API dives have activity_details set to null; their samples come from FIT.

        FIT documents and original file bytes are omitted entirely, including for
        administrators and include=fit requests. Original FIT files are available
        only at the authenticated download /api/v1/admin/dives/{id}/fit.

        '
      responses:
        '200':
          description: Dive summary, Garmin documents, indexed metadata/alerts and media, without FIT documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Dives
      operationId: updateDive
      summary: Update cover, country override, or trip membership
      description: Omitted fields remain unchanged. Updates are atomic. country_code=null restores GPS detection.
        trip_id=null persists an exclusion; trip_mode=auto restores automatic assignment. Cover selections must belong
        to the dive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DivePatch'
            examples:
              select:
                summary: Choose an attached photo
                value:
                  cover_media_id: 4f899e011d1c4c18b1034b9e5a335198
              clear:
                summary: Clear the cover
                value:
                  cover_media_id: null
      responses:
        '200':
          description: Updated dive summary, including the selected cover photo or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Administrator authentication required or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - adminSession: []
      - adminSessionDevelopment: []
  /api/v1/dives/{id}/samples:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    get:
      tags:
      - Dives
      operationId: listDiveSamples
      summary: Read dive profile samples in sample-index order
      description: >-
        Returns indexed chart measurements only. Raw source/FIT records are
        internal SQL data and are never embedded in sample responses, even for
        administrators or include_raw=true requests. Every stored sample is
        available through cursor pagination; measurements are not downsampled.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 5000
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of samples. Missing metrics are omitted; next_cursor is omitted on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dives/{id}/media:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    get:
      tags:
      - Media
      operationId: listDiveMedia
      summary: List attachments, sorted by retained filename
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of media. next_cursor is omitted on the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Media
      operationId: uploadDiveMedia
      summary: Upload and process one photo or video
      description: |
        Send exactly one multipart field named file. Filenames cannot start with a dot,
        contain separators/control characters, or exceed 255 bytes. Existing names,
        including converted original-name aliases and unindexed files, return 409, except
        re-uploading an original HEIC to repair a legacy decoder conversion preserves
        that existing media ID and its editorial fields/covers.
        The default upload limit is 16 GiB; read the current limit from media/status.
        Processing is synchronous. A photo strictly below 1,000,000 bytes AND below
        2048 pixels on its shorter side keeps its bytes/name. Other photos become JXL
        at 1080 on the shorter side, cjxl -d 1.5 -e 7. All photos get a JXL thumbnail
        at 480 on the shorter side, -d 2.0 -e 8. Aspect ratio is preserved, no upscaling.
        Converted names append .jxl (very long names are shortened with a hash).
        Only after verified image/thumbnail processing and SQL success is the source
        deleted. IDs, descriptions, favorites and covers survive conversion/rescans.
        HEIC uses libheif for full grid assembly and orientation, never a single HEVC
        tile. Ambiguous multi-image HEIF containers retain the source with an error.
        Unsupported codecs, missing tools, and animated sources requiring conversion
        keep the source with thumbnail_status=error. Videos normalize to H.264/yuv420p MP4,
        maximum 1920x1080 landscape or 1080x1920 portrait, preserving aspect ratio without
        upscaling. Compatible MP4/M4V files remain unchanged. Other containers append .mp4;
        compatible H.264 is stream-copied where possible and other audio becomes AAC.
        Conversion/thumbnail/SQL verification precedes source cleanup. IDs, capture and
        editorial fields survive. HDR conversion requires zscale/tonemap; failures retain the source.
        Spherical projection metadata is detected when present. Use PATCH with
        projection="360" for an untagged stitched equirectangular export.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: One photo or video with its original filename.
      responses:
        '201':
          description: Retained file stored and indexed; inspect thumbnail_status for processing results.
          headers:
            Location:
              description: Relative URL of the created attachment metadata.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Administrator authentication required or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - adminSession: []
      - adminSessionDevelopment: []
  /api/v1/dives/{id}/media/{mediaID}:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    - $ref: '#/components/parameters/MediaID'
    get:
      tags:
      - Media
      operationId: getDiveMedia
      summary: Read attachment metadata and URLs
      responses:
        '200':
          description: Media metadata; originals and thumbnails are served separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Media
      operationId: updateDiveMedia
      summary: Update media description, caption, favorite, or projection
      description: 'Provide at least one field. Omitted fields are kept. An empty description

        or caption clears that field. Descriptions describe what the photo/video

        shows and can contain up to 8192 UTF-8 bytes. Changing projection or stereo_layout regenerates the

        thumbnail. Use projection="360" for an untagged stitched equirectangular

        video, "flat" to disable spherical playback, or "auto" to use detected

        metadata. This metadata edit does not re-encode the retained master.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPatch'
            example:
              caption: Reef wall panorama
              description: A sea turtle swimming above the reef near the end of the dive.
              projection: '360'
      responses:
        '200':
          description: Updated media metadata and thumbnail status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Administrator authentication required or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - adminSession: []
      - adminSessionDevelopment: []
    delete:
      tags:
      - Media
      operationId: deleteDiveMedia
      summary: Delete an attachment and its files
      description: Deletes the original file, cached thumbnail, and database metadata.
      responses:
        '204':
          description: Attachment deleted; the response body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Administrator authentication required or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - adminSession: []
      - adminSessionDevelopment: []
  /api/v1/dives/{id}/media/{mediaID}/thumbnail:
    parameters:
    - $ref: '#/components/parameters/ActivityID'
    - $ref: '#/components/parameters/MediaID'
    - $ref: '#/components/parameters/Range'
    - $ref: '#/components/parameters/IfNoneMatch'
    - $ref: '#/components/parameters/IfModifiedSince'
    - $ref: '#/components/parameters/IfRange'
    - $ref: '#/components/parameters/MediaImageFormat'
    - $ref: '#/components/parameters/MediaImageAccept'
    - name: v
      in: query
      description: Optional thumbnail version from thumbnail_url; the current thumbnail is always served.
      schema:
        type: string
    get:
      tags:
      - Assets
      operationId: getDiveMediaThumbnail
      summary: Serve a photo or video thumbnail
      description: |
        Photos use JXL at a 480-pixel shorter side without upscaling; JPEG fallback
        is generated on demand and cached. Videos use JPEG up to 640x640, with a
        640x360 perspective preview for equirectangular 360 video. Photo 360 previews
        target a 480-pixel shorter side without upscaling. Auto format selects JXL
        only for explicit positive Accept: image/jxl; otherwise JPEG is served.
        Use format=original for stored thumbnail bytes, or format=jpeg for JPEG.
        Auto photo responses vary by Accept, with representation-specific ETags.
        Missing/failed thumbnails return 404 thumbnail_unavailable; rescan to retry.
      responses:
        '200':
          description: Complete thumbnail in the selected image format.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/jxl:
              schema:
                type: string
                format: binary
        '206':
          $ref: '#/components/responses/PartialFile'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    head:
      tags:
      - Assets
      operationId: headDiveMediaThumbnail
      summary: Read thumbnail headers without downloading it
      responses:
        '200':
          $ref: '#/components/responses/FileHeaders'
        '206':
          $ref: '#/components/responses/PartialFileHeaders'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /assets/{id}/{filename}:
    parameters:
    - $ref: '#/components/parameters/MediaImageFormat'
    - $ref: '#/components/parameters/MediaImageAccept'
    - $ref: '#/components/parameters/ActivityID'
    - name: filename
      in: path
      required: true
      description: Original filename from MediaItem.filename; URL-encode it or use MediaItem.url directly.
      schema:
        type: string
        minLength: 1
      example: Turtle original.jpeg
    - $ref: '#/components/parameters/Range'
    - $ref: '#/components/parameters/IfNoneMatch'
    - $ref: '#/components/parameters/IfModifiedSince'
    - $ref: '#/components/parameters/IfRange'
    get:
      tags:
      - Assets
      operationId: getMediaOriginal
      summary: Serve a retained photo or normalized video
      description: |
        Streams retained media with inline filename. Photo content_type in metadata
        describes the stored master; HTTP Content-Type describes the representation
        selected here. Auto (default) serves JXL only for explicit positive
        Accept: image/jxl; otherwise a quality-90 JPEG fallback is generated once
        and cached. HEIC/TIFF/BMP also use auto JPEG fallback. format=original forces
        retained bytes; format=jpeg forces JPEG for photos. Valid format choices
        do not transcode videos. Auto photo responses include Vary: Accept; JXL/JPEG
        have distinct ETags. Range, HEAD and conditional requests are supported.
        A changed indexed file returns 409 media_changed until rescan. Directory
        browsing is disabled. Use effective_projection/projection_format to choose
        a 360-degree player; videos are normalized on ingestion, never on asset GET. Raw lenses are not stitched.
      responses:
        '200':
          $ref: '#/components/responses/CompleteFile'
        '206':
          $ref: '#/components/responses/PartialFile'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    head:
      tags:
      - Assets
      operationId: headMediaOriginal
      summary: Read retained-file headers without downloading it
      responses:
        '200':
          $ref: '#/components/responses/FileHeaders'
        '206':
          $ref: '#/components/responses/PartialFileHeaders'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
