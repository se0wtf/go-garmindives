          $ref: '#/components/schemas/DatabaseDisplay'
        http:
          $ref: '#/components/schemas/HTTPSettings'
        auth:
          $ref: '#/components/schemas/AuthSettings'
        media:
          $ref: '#/components/schemas/MediaSettings'
        overrides:
          type: object
          additionalProperties:
            type: string
        restart_required:
