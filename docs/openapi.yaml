        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Trips
      operationId: uploadTripMedia
      summary: Upload and process one photo or video
      description: |
        Send exactly one multipart field named file. Filenames cannot start with a dot,
        contain separators/control characters, or exceed 255 bytes. Existing names,
        including converted original-name aliases and unindexed files, return 409, except
        re-uploading an original HEIC to repair a legacy decoder conversion preserves
        that existing media ID and its editorial fields/covers.
        The default upload limit is 16 GiB; read the current limit from media/status.
        Processing is synchronous. A photo strictly below 1,000,000 bytes AND below
        2048 pixels on its shorter side keeps its bytes/name. Other photos become JXL
        at 1080 on the shorter side, cjxl -d 1.5 -e 7. All photos get a JXL thumbnail
        at 480 on the shorter side, -d 2.0 -e 8. Aspect ratio is preserved, no upscaling.
        Converted names append .jxl (very long names are shortened with a hash).
        Only after verified image/thumbnail processing and SQL success is the source
        deleted. IDs, descriptions, favorites and covers survive conversion/rescans.
        HEIC uses libheif for full grid assembly and orientation, never a single HEVC
        tile. Ambiguous multi-image HEIF containers retain the source with an error.
        Unsupported codecs, missing tools, and animated sources requiring conversion
        keep the source with thumbnail_status=error. Videos normalize to H.264/yuv420p MP4,
        maximum 1920x1080 landscape or 1080x1920 portrait, preserving aspect ratio without
        upscaling. Compatible MP4/M4V files remain unchanged. Other containers append .mp4;
        compatible H.264 is stream-copied where possible and other audio becomes AAC.
        Conversion/thumbnail/SQL verification precedes source cleanup. IDs, capture and
        editorial fields survive. HDR conversion requires zscale/tonemap; failures retain the source.
        Spherical projection metadata is detected when present. Use PATCH with
        projection="360" for an untagged stitched equirectangular export.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: One photo or video with its original filename.
      responses:
        '201':
          description: Retained file stored and indexed; inspect thumbnail_status for processing results.
          headers:
            Location:
              description: Relative URL of the created attachment metadata.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'Before initial setup: error.code=not_configured. After setup, unavailable services remain
            configured and return a service/database availability error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Administrator authentication required or session expired/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cross-origin write rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - adminSession: []
      - adminSessionDevelopment: []
