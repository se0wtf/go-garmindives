        stored dive logbook, sorted by code. A manual country override replaces
        the detected country. Unknown or unlabeled countries are omitted. Codes
        are canonical and each item contains French and English names. Empty
        logbooks return items as an empty array. This list is independent of dive
        pagination and other dive-list filters. It is read from SQL without
