version: 1
initialized: false
# instance_id is generated by setup. Preserve it when moving configuration.
database:
  type: sqlite
  uri: dives.db
  # Or: type: postgres, uri: postgres://user:password@db:5432/dives
  # Prefer GARMIN_DB_URI in both backend containers for environment-only secrets.
http:
  listen: 0.0.0.0:8080
  cookie_secure: true
  # public_url: https://dives.example.com
auth:
  session_lifetime: 24h
  idle_timeout: 2h
media:
  directory: assets
  max_upload_bytes: 17179869184
  pending_directory: pending # Relative to media.directory; absolute paths also work.
  pending_scan_interval: 60s
