# Every runtime setting supports flags > ENV > YAML > defaults.
# All application ENV names start with DIVELOG_ (e.g. DIVELOG_GARMIN_REQUEST_INTERVAL).
# Complete mapping: docs/specs/settings.md. These values are the built-in defaults.
version: 1
initialized: false
# instance_id is generated by setup. Preserve it when moving configuration.
database:
  type: sqlite
  uri: dives.db
  # Or: type: postgres, uri: postgres://user:password@db:5432/dives
http:
  listen: 127.0.0.1:8080 # Use 0.0.0.0:8080 to listen outside a container.
  cookie_secure: true
  public_url: "" # Example: https://dives.example.com
auth:
  session_lifetime: 24h
  idle_timeout: 2h
media:
  directory: assets
  max_upload_bytes: 17179869184
  pending_directory: pending # Relative to media.directory, unless absolute.
  pending_scan_interval: 60s
garmin:
  personal_api_key: "" # Official API; empty selects cached/legacy CLI login.
  email: ""
  password: "" # Leading/trailing spaces are preserved.
  mfa_code: "" # Optional current one-time code for legacy CLI login.
  token_file: "" # Automatic CLI cache under the OS user configuration directory.
  resync_token_file: "" # Separate automatic serve resync cache.
  request_interval: 2s
translation:
  api_key: "" # Empty disables outgoing DeepL translation.
  url: "" # Automatic Free/Pro origin selected from the key.
  target_lang: EN-GB
  glossary_id: ""
  interval: 2s
geocoding:
  enabled: true
  url: https://nominatim.openstreetmap.org
  interval: 15s
  user_agent: go-garmindives/1.0 (https://github.com/se0wtf/go-garmindives)
logging:
  level: info
# YAML may explicitly hold secrets; keep it private. Application writes use 0600.
# Credentials supplied through ENV/flags are never automatically copied into YAML.
