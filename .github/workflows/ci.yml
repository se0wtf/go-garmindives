name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator docs/openapi.yaml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: garmindives_test
          POSTGRES_PASSWORD: garmindives_test
          POSTGRES_DB: garmindives_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmindives_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://garmindives_test:garmindives_test@localhost:5432/garmindives_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libjxl-tools libheif-examples libheif-plugin-libde265
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
